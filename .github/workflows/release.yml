name: 'Release EnvForIO'

# Builds the Windows installers and attaches them to a draft GitHub release.
# Push a tag that matches the version in src-tauri/tauri.conf.json (v0.1.0
# for 0.1.0), check the draft, then publish it by hand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release, e.g. v0.1.0 (must match tauri.conf.json)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match app version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach to a draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: 'EnvForIO ${{ env.TAG }}'
          releaseBody: |
            ## Install

            Download one of the Windows installers below:

            - **`EnvForIO_*_x64-setup.exe`**: installs for your account only; no administrator rights needed.
            - **`EnvForIO_*_x64_en-US.msi`**: installs for all users on the machine.

            The installers are not code-signed yet, so Windows SmartScreen may warn the first time. Choose **More info**, then **Run anyway**.

            EnvForIO does not update itself yet: download the next release when it comes out. Your data stays in `%APPDATA%\io.github.envforio`.

            **Changes**: https://github.com/${{ github.repository }}/commits/${{ env.TAG }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: --bundles msi,nsis
