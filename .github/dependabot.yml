# Dependabot version updates: once a month, one pull request per ecosystem
# for minor and patch updates, and one for major updates.
# Security updates are separate: they arrive whenever an advisory is published
# (repository settings → Advanced Security).
#
# Not updated here, upgrade them by hand:
# - Tauri itself (tauri*, @tauri-apps/*), minor and major: the Rust crates and
#   their npm packages must move together, and Dependabot opens separate pull
#   requests for Cargo and npm. Patch updates are fine on their own.
# - specta, tauri-specta, specta-typescript: release candidates pinned exactly
#   (=x.y.z) in src-tauri/Cargo.toml.
# Not updated at all: tauri-nspanel, a macOS-only git dependency.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '@tauri-apps/*'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      npm-minor:
        update-types: ['minor', 'patch']
      npm-major:
        update-types: ['major']

  - package-ecosystem: 'cargo'
    directory: '/src-tauri'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: 'tauri'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'tauri-build'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'tauri-plugin-*'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'specta'
      - dependency-name: 'tauri-specta'
      - dependency-name: 'specta-typescript'
      # macOS-only (the quick pane); Windows releases never build it.
      - dependency-name: 'tauri-nspanel'
    groups:
      cargo-minor:
        update-types: ['minor', 'patch']
      cargo-major:
        update-types: ['major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns: ['*']
