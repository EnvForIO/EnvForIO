# Dependabot version updates: every Monday morning (Singapore time), one
# pull request per ecosystem with the minor and patch updates.
# Security updates are separate: they arrive whenever an advisory is published
# (repository settings → Advanced Security), major versions included.
#
# Not updated here, upgrade them by hand, one at a time:
# - Major versions of everything: they can change APIs, so each one gets its
#   own change and its own testing.
# - Tauri itself (tauri*, @tauri-apps/*), minor versions too: the Rust crates
#   and their npm packages must move together, and Dependabot opens separate
#   pull requests for Cargo and npm. Patch updates are fine on their own.
# - specta, tauri-specta, specta-typescript: release candidates pinned exactly
#   (=x.y.z) in src-tauri/Cargo.toml.
# Not updated at all: tauri-nspanel, a macOS-only git dependency.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Singapore'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tauri-apps/*'
        update-types: ['version-update:semver-minor']
    groups:
      npm-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'cargo'
    directory: '/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Singapore'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'tauri-build'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'tauri-plugin-*'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'specta'
      - dependency-name: 'tauri-specta'
      - dependency-name: 'specta-typescript'
      # macOS-only (the quick pane); Windows releases never build it.
      - dependency-name: 'tauri-nspanel'
    groups:
      cargo-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Singapore'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns: ['*']
